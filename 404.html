<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Seite nicht gefunden – Pinpoint Medical</title>
<meta name="theme-color" content="#1B3358">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--navy:#1B3358;--teal:#3E8E8E;--ink:#1B2B40;--muted:#5B6878;--line:#E1E5EC;--bg:#F3F5F8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
header{padding:18px 20px;background:#fff;border-bottom:1px solid var(--line)}
header a{font-family:Montserrat,Inter,sans-serif;font-weight:800;color:var(--navy);text-decoration:none;letter-spacing:.3px}
header span{color:var(--teal)}
main{flex:1;display:grid;place-items:center;padding:40px 16px}
.card{max-width:440px;width:100%;background:#fff;border:1px solid var(--line);border-radius:16px;padding:36px 28px;text-align:center}
.code{font-family:Montserrat,Inter,sans-serif;font-weight:800;font-size:64px;line-height:1;color:var(--navy);letter-spacing:2px}
.code b{color:var(--teal)}
h1{font-size:20px;margin:16px 0 6px}
p{margin:0 0 24px;color:var(--muted)}
.btn{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;font-weight:600;padding:13px 24px;border-radius:10px}
.btn:hover{background:#142846}
</style>
</head>
<body>
<header><a href="/">PINPOINT <span>MEDICAL</span></a></header>
<main>
  <div class="card">
    <div class="code">4<b>0</b>4</div>
    <h1>Diese Seite gibt es nicht</h1>
    <p>Vielleicht hat sich der Link geändert. Im Shop findest du alle Produkte.</p>
    <a class="btn" href="/#shop">Zum Shop</a>
  </div>
</main>
</body>
</html>
